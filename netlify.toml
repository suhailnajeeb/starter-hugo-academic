[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.97.3"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# Retire the legacy Netlify hostname in favour of the canonical portfolio.
# Keep the most useful content families pointed at their closest current
# landing page, then intentionally fall back unmatched legacy paths to home.
[[redirects]]
  from = "https://suhailnajeeb.netlify.app/post/chatgpt/*"
  to = "https://suhailnajeeb.com/writing"
  status = 301
  force = true

